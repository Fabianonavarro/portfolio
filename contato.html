<main class="container">
  <div class="container">
    <h1 class="text-center mb-4" style="color: var(--primary-color)">Fale Conosco</h1>
    
    <div class="card mx-auto" style="max-width: 600px;">
      <h2 class="mb-3">Entre em contato</h2>
      <form id="subscriptionForm">
        <input type="text" id="name" name="name" placeholder="Digite seu nome" required>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        <select id="assunto" name="assunto" required>
          <option value="">Escolha o assunto</option>
          <option value="Duvidas">Dúvidas</option>
          <option value="Orcamento">Orçamento</option>
          <option value="Outros">Outros</option>
        </select>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
        <button type="submit" class="btn btn-primary w-100">Enviar Mensagem</button>
      </form>
    </div>
  </div>
</main>
